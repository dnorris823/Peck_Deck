# MediaMTX for the Peck Deck feeder. Pinned version and install steps are in
# SETUP.md, "Live video". Tested on MediaMTX v1.21.3.
#
# The Pi service publishes H.264 over RTSP on localhost, and MediaMTX serves it
# to the backend's WHEP relay over WebRTC. No secrets live here. The unit's env
# file supplies the read credentials and the Pi's address:
#
#   MTX_AUTHINTERNALUSERS_1_USER   the backend's LIVE_READ_USER
#   MTX_AUTHINTERNALUSERS_1_PASS   the backend's LIVE_READ_PASSWORD
#   MTX_WEBRTCADDITIONALHOSTS      the Pi's LAN address, and its Tailscale one
#
# MediaMTX runs with the repo as its working directory, so the runOnDemand
# command below resolves against the repo's .venv.

logLevel: info
logDestinations: [stdout]

authMethod: internal
authInternalUsers:
  # The Pi service publishes from localhost, with no password.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: feeder
  # The backend reads. The env file overrides both values. These placeholders
  # never match a real request: the password is a sha256 hash with no known
  # preimage, so a missing env file locks every reader out.
  - user: live-read-user-not-set
    pass: sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ips: []
    permissions:
      - action: read
        path: feeder

# Only RTSP, for the local publisher, and WebRTC, for the backend.
api: false
metrics: false
pprof: false
playback: false
rtmp: false
hls: false
srt: false
moq: false

rtsp: true
rtspAddress: 127.0.0.1:8554
# TCP only. The UDP transports would open RTP and RTCP ports on every interface.
rtspTransports: [tcp]
rtspEncryption: "no"

webrtc: true
# WHEP signalling. The backend relays offers here.
webrtcAddress: :8889
webrtcEncryption: false
# The browser never calls MediaMTX directly, so no origin needs CORS.
webrtcAllowOrigins: []
# Media. The browser connects to this port on the Pi once ICE completes.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

paths:
  feeder:
    source: publisher
    # Holds the Pi service's demand socket open while anyone watches. MediaMTX
    # sends it SIGINT when the last viewer has been gone for CloseAfter.
    runOnDemand: .venv/bin/python -m raspberry_pi_code.live_demand
    runOnDemandRestart: false
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 10s
