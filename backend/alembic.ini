# Alembic configuration for the Peck Deck backend.
#
# Lives inside backend/ (rather than the repo root) so it ships in the Docker
# image, which only copies backend/ into /app/backend.
#
# The database URL is NOT set here — env.py reads it from settings.DATABASE_URL
# so migrations and the app can never disagree about which database they mean.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so `ls versions/` sorts
# chronologically and merge conflicts are obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
