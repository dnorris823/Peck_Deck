services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peck_deck
      POSTGRES_USER: peck_deck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peck_deck -d peck_deck"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://peck_deck:${POSTGRES_PASSWORD:-changeme}@db:5432/peck_deck
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # /ready (not /health) — it confirms the database is reachable AND the
    # schema is migrated, so the container is only reported healthy once it can
    # actually serve. start_period covers the migration run in entrypoint.sh.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
