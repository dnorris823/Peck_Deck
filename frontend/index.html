<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Peck Deck</title>
<!-- viewport-fit=cover so the standalone PWA can paint into the notch area;
     the shell adds safe-area padding to keep controls clear of it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Watch what visits your bird feeder: live sightings, species identifications, and feeder health." />

<!-- PWA: installable app shell (FLEDGE Phase 7) -->
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Two theme colors so the phone's status bar matches the active theme rather
     than always the light one. -->
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<!-- iOS ignores the manifest's display mode; these are its equivalents. The
     apple- prefix is deprecated in Chrome but still what Safari reads, so both
     spellings ship. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Peck Deck" />

<!-- Plus Jakarta Sans is self-hosted (public/fonts), so the installed app has
     its type with no network. The upright Latin file covers nearly every
     glyph on screen; preloading it stops a flash of the fallback face. -->
<link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
