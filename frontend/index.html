<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Peck Deck — Field Station</title>
<!-- viewport-fit=cover so the standalone PWA can paint into the notch area;
     the shell adds safe-area padding to keep controls clear of it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Watch what visits your bird feeder: live sightings, species identifications, and station health." />

<!-- PWA: installable app shell (FLEDGE Phase 7) -->
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Two theme colors so the phone's status bar matches the active theme rather
     than always the light one. -->
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#151b17" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<!-- iOS ignores the manifest's display mode; these are its equivalents. The
     apple- prefix is deprecated in Chrome but still what Safari reads, so both
     spellings ship. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Peck Deck" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
